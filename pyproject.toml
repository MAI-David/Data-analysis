# Python code formatter configuration
# Uses Black - The uncompromising code formatter
# https://black.readthedocs.io/

[tool.black]
line-length = 88
target-version = ['py38', 'py39', 'py310', 'py311']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | _build
  | buck-out
  | build
  | dist
  | data
)/
'''

[tool.isort]
# Import sorting configuration
# Compatible with Black
profile = "black"
line_length = 88
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true
skip_gitignore = true

[tool.pylint.messages_control]
# Pylint configuration
disable = [
    "C0103",  # Invalid name (for scientific variable names like X, y)
    "C0114",  # Missing module docstring (allow for scripts)
    "C0115",  # Missing class docstring
    "C0116",  # Missing function docstring (we use NumPy style)
    "R0913",  # Too many arguments (needed for ML functions)
    "R0914",  # Too many local variables
    "W0212",  # Access to protected member (needed for TensorFlow)
]

[tool.pylint.format]
max-line-length = 88

[tool.mypy]
# Type checking configuration
python_version = "3.8"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true

# Per-module options
[[tool.mypy.overrides]]
module = [
    "tensorflow.*",
    "sklearn.*",
    "xgboost.*",
    "lightgbm.*",
    "lime.*",
    "shap.*",
    "seaborn.*",
    "scipy.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
# Pytest configuration (for future test suite)
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "-v",
    "--strict-markers",
    "--tb=short",
]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
]

[tool.coverage.run]
# Coverage configuration (for future test suite)
source = ["notebooks"]
omit = [
    "*/tests/*",
    "*/test_*",
    "*/__pycache__/*",
    "*/venv/*",
    "*/.venv/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "@abstractmethod",
]
